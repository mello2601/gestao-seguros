<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Seguros</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#painel" aria-label="Gestão de Seguros, ir para o painel">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <path d="M16 2.5 4.5 6.6v8.2c0 7.4 4.8 12.8 11.5 14.7 6.7-1.9 11.5-7.3 11.5-14.7V6.6L16 2.5Z" fill="var(--teal)"/>
        <path d="M20.2 11.6c-.9-1.4-2.4-2.2-4.2-2.2-2.3 0-4 1.3-4 3.1 0 4.1 8.4 2.5 8.4 6.8 0 1.9-1.8 3.4-4.4 3.4-1.9 0-3.6-.9-4.5-2.4" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Gestão <span>de Seguros</span></span>
    </a>
    <nav class="nav">
      <a href="#painel" data-view="painel">Painel</a>
      <a href="#segurados" data-view="segurados">Segurados</a>
      <a href="#apolices" data-view="apolices">Apólices</a>
      <a href="#renovacoes" data-view="renovacoes">Renovações <span id="badge-renov" class="count hidden"></span></a>
      <a href="#financeiro" data-view="financeiro">Financeiro</a>
      <a href="#tipos" data-view="tipos">Tipos de seguro</a>
    </nav>
    <button class="search-trigger" onclick="openPalette()">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Buscar segurado ou apólice</span>
      <kbd>Ctrl K</kbd>
    </button>
    <button class="btn primary" onclick="formApolice()">Nova apólice</button>
  </header>

  <main id="app"></main>

  <!-- painel lateral -->
  <div id="scrim" class="scrim" onclick="closeDrawer()"></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Fechar">
      <svg viewBox="0 0 20 20" width="18" height="18"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div id="drawer-content"></div>
  </aside>

  <!-- paleta de comandos -->
  <div id="palette" class="palette hidden" role="dialog" aria-modal="true" aria-label="Busca">
    <div class="palette-box">
      <input id="palette-input" type="text" placeholder="Nome, CPF/CNPJ, número da apólice, placa, seguradora…" autocomplete="off">
      <div id="palette-results" class="palette-results"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span></div>
    </div>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
